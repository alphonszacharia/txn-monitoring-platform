version: 2

sources:
  - name: raw
    description: Bronze layer, loaded by ingestion/load_raw.py exactly as received.
    schema: raw
    loaded_at_field: _loaded_at
    freshness:
      warn_after: {count: 7, period: day}
      error_after: {count: 30, period: day}
    tables:
      - name: customers
      - name: accounts
      - name: transactions
      - name: ground_truth
        description: Planted-pattern answers from the generator, used only for evaluating alert rules.
